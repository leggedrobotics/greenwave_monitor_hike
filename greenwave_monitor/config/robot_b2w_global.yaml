# B2W robot configuration for greenwave_monitor (additional global-mode topics)
# Loaded on top of robot_b2w.yaml when global:=true

greenwave_monitor:
  ros__parameters:
    gw_frequency_monitored_topics:
      # Holistic fusion / graph MSF (PC4)
      /graph_msf/est_odometry_odom_imu:
        expected_frequency: 100.0
        tolerance: 10.0
      # SwiftNav GNSS (PC3)
      /navsatfix:
        expected_frequency: 100.0
        tolerance: 10.0
      # Global planner goals (PC3)
      /goal:
        expected_frequency: 0.2
        tolerance: 0.05
      /goal_continuous:
        expected_frequency: 1.0
        tolerance: 0.2
      # Global path manager state
      /lodia/global_path_manager_state:
        expected_frequency: 1.0
        tolerance: 0.2
