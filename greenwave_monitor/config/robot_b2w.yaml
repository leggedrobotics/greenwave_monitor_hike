# B2W robot configuration for greenwave_monitor (local mode)
# Topics and expected frequencies for the overview terminal (ncurses_dashboard)

greenwave_monitor:
  ros__parameters:
    gw_monitored_topics: []
    gw_frequency_monitored_topics:
      # DLIO odometry (PC3)
      /dlio/odom_node/odom:
        expected_frequency: 100.0
        tolerance: 10.0
      # Lidar point cloud (PC3)
      /lidar/point_cloud:
        expected_frequency: 10.0
        tolerance: 1.0
      # ZED semantic segmentation (PC6)
      /zed/zed_node/rgb/lmm_nav_sem:
        expected_frequency: 5.0
        tolerance: 0.5
      # Path manager velocity (PC6)
      /path_manager/path_manager_ros/nav_vel:
        expected_frequency: 5.0
        tolerance: 0.5
      # Planner status (1 Hz)
      /rl_sem_nav_controller/status:
        expected_frequency: 1.0
        tolerance: 0.2
