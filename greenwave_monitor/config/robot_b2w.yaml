# B2W robot configuration for greenwave_monitor

greenwave_monitor:
  ros__parameters:
    gw_frequency_monitored_topics:
      # --- Local navigation (always active) ---

      # DLIO odometry (PC3)
      /dlio/odom_node/odom:
        expected_frequency: 100.0
        tolerance: 10.0
      # Lidar point cloud (PC3)
      /lidar/point_cloud:
        expected_frequency: 10.0
        tolerance: 1.0
      # ZED semantic segmentation (PC6)
      /zed/zed_node/rgb/lmm_nav_sem:
        expected_frequency: 5.0
        tolerance: 0.5
      # Path manager velocity (PC6)
      /path_manager/path_manager_ros/nav_vel:
        expected_frequency: 5.0
        tolerance: 0.5
      # Planner status (1 Hz)
      /rl_sem_nav_controller/status:
        expected_frequency: 1.0
        tolerance: 0.2

      # --- Global navigation (stale in local mode) ---

      # Holistic fusion / graph MSF (PC4)
      /graph_msf/est_odometry_odom_imu:
        expected_frequency: 100.0
        tolerance: 10.0
      # SwiftNav GNSS (PC3)
      /navsatfix:
        expected_frequency: 100.0
        tolerance: 10.0
      # Global planner goals (PC3)
      /goal:
        expected_frequency: 0.2
        tolerance: 0.05
      /goal_continuous:
        expected_frequency: 1.0
        tolerance: 0.2
      # Global path manager state
      /lodia/global_path_manager_state:
        expected_frequency: 1.0
        tolerance: 0.2
